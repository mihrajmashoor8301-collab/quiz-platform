project_id = "quiz-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:8787"
additional_redirect_urls = ["http://127.0.0.1:8787", "http://localhost:8787/host"]
enable_signup = true
jwt_expiry = 3600

[auth.email]
enabled = true
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
